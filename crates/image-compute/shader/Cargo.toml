[package]
name = "image-compute-shader"
version = "0.1.0"
edition = "2024"
publish = false

# Direct commands run from this directory use the pinned rust-toolchain.toml.
# The nightly-only shader builder remains in its own nested workspace.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("spirv"))'] }

[dependencies]
spirv-std = "=0.10.0-alpha.1"

# rust-gpu 0.10 currently accepts newer glam releases that are not yet
# compatible with its SPIR-V target. Keep the resolver on a known-good version.
[target.'cfg(target_arch = "spirv")'.dependencies]
glam = { version = "=0.32.1", default-features = false, features = ["libm"] }

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
bytemuck = { version = "1.20", features = ["derive"] }
glam = { version = "=0.32.1", features = ["bytemuck"] }
