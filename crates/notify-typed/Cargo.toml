[package]
name = "notify-typed"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = { workspace = true }
tracing = { workspace = true }
eyre = { workspace = true }
tokio = { workspace = true }
notify = "8.2.0"
bitflags = "2.9.4"
futures = "0.3.31"
binrw = "0.15.0"
num_enum = "0.7.4"
bbq2 = { version = "0.4.2", default-features = false, features = [
    "std",
    "maitake-sync-0_2",
] }
async-stream = "0.3.6"

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <=0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_System_Threading",
] }
