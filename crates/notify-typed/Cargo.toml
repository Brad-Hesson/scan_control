[package]
name = "notify-typed"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = { workspace = true }
tracing = { workspace = true }
eyre = { workspace = true }
tokio = { workspace = true }
notify = "8.2.0"

[target.'cfg(windows)'.dependencies]
windows = { version = ">=0.59, <=0.62", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_Security",
] }
