[package]
name = "scan_control"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = "1.20.0"
eframe = { version = "0.29.1", features = ["wgpu"] }
egui = { version = "0.29.1", features = ["mint"] }
env_logger = "0.11.5"
glam = { version = "0.29.2", features = ["mint"] }
itertools = "0.13.0"
mint = "0.5.9"
serde = { version = "1.0.215", features = ["derive"] }
uuid = { version = "1.11.0", features = ["v4"] }

[build-dependencies]
wgsl_to_wgpu = "0.11.1"
