[package]
name = "scan_control"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing-subscriber = { workspace = true, features = ["env-filter"] }
env_logger = "0.11"
eframe = { version = "0.32", features = ["wgpu"] }
egui = { version = "0.32", features = ["mint"] }
# egui-colorgradient = { path = "../egui-colorgradient/egui-colorgradient" }
glam = { version = "0.30", features = ["mint"] }
mint = "0.5.9"
itertools.workspace = true
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.18", features = ["v4"] }
image-compute = { path = "crates/image-compute" }
sxmfile = { path = "crates/sxmfile" }
wgpu = { workspace = true, default-features = false, features = ["wgsl"] }
bytemuck.workspace = true
eyre.workspace = true
tracing.workspace = true
smol.workspace = true
egui-file-dialog = "0.11.0"

[build-dependencies]
wgsl_to_wgpu.workspace = true

[dev-dependencies]
pollster = "0.4.0"

[workspace]
members = ["crates/sxmfile", "crates/image-compute"]

[workspace.dependencies]
bytemuck = "1.20"
itertools = "0.14"
wgpu = { version = "25.0", default-features = false } # need to use 25.0 because of egui
wgsl_to_wgpu = "0.15.0"                               # latest version that uses wgpu 25.0
eyre = "0.6"
tracing = "0.1"
smol = "2.0.2"
tracing-subscriber = "0.3"
